plugins {
    // Minecraft 26.x ships unobfuscated, so this is the non-remapping Loom plugin (no mappings needed).
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Dev-only: lets the IntelliJ test client log into your real Microsoft account so you can join Hypixel.
    // Not included in the built mod jar.
    localRuntime "net.litetex.mcm:dev-auth-neo:1.1.1"
}

loom {
    runs {
        client {
            property "devauth.enabled", "1"
            property "devauth.account", "main"
            // Sign in through your normal browser (the built-in Chromium popup crashes on this setup)
            property "devauth.microsoft.oauth2.grant-flow", "auth-code-external"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
